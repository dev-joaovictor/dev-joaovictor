name: Divulgar projetos no LinkedIn

on:
  # Toda segunda-feira as 12:00 UTC (09:00 no horario de Brasilia)
  schedule:
    - cron: "0 12 * * 1"
  # Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar sem publicar (apenas mostrar o texto)"
        type: boolean
        default: true

jobs:
  divulgar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para salvar o estado (posted.json)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Executar rotina
        env:
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || github.repository_owner }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          MAX_POSTS: ${{ vars.MAX_POSTS || '1' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python automation/github_to_linkedin.py

      - name: Salvar estado (repos ja divulgados)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          if [ -n "$(git status --porcelain automation/state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add automation/state
            git commit -m "chore: atualiza estado de projetos divulgados no LinkedIn"
            git push
          else
            echo "Sem mudancas no estado."
          fi
